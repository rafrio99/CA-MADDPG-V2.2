experiment:
  name: maddpg_learning_smoke
  seed: 42
  device: cuda
  gpu_id: 0
data:
  task_file: data/processed_tasks.csv
  uav_file: data/uav_profiles.csv
environment:
  num_agents: 10
  episode_length: 100
  shared_reward: true
  task_features:
  - task_type_code
  - task_size_MB
  - cpu_cycles_per_bit
  - capability_MIPS
  - task_cpu_demand_cycles
  - delay_deadline_ms
  - energy_deadline_mJ
  - Battery_Level_%
  - Signal_Strength_dBm
  - distance_m
  - channel_gain_dB
  - bandwidth_MHz_x
  - uplink_data_rate_Mbps
  - uplink_power_transfer_mW
  - task_priority_score
  - Priority_Score
  - time_sin
  - time_cos
  agent_features:
  - mec_uav_cpu_GHz
  - mec_uav_remaining_energy_mAh
  - bandwidth_MHz_y
  - uplink_rate_Mbps
  - downlink_rate_Mbps
  - aec_storage_GB
  - aec_ram_GB
  action:
    dimension: 3
    names:
    - selection_score
    - cpu_fraction
    - bandwidth_fraction
    minimum: 0.0
    maximum: 1.0
  reward_weights:
    success: 2.0
    latency: 1.0
    energy: 0.5
    deadline_violation: 2.0
    resource_overload: 1.5
    load_balance: 0.25
  calibration:
    task_size_bits_per_unit: 1000.0
    workload_multiplier: 100.0
    use_distance_rate_penalty: false
    downlink_output_fraction: 0.05
    maximum_compute_power_watts: 50.0
    battery_voltage: 11.1
training:
  episodes: 5
  batch_size: 64
  replay_capacity: 5000
  warmup_steps: 200
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.001
  hidden_dimensions:
  - 256
  - 256
  exploration_noise: 0.2
  minimum_noise: 0.05
  noise_decay: 0.9995
  checkpoint_interval: 5
  evaluation_interval: 5
  evaluation_episodes: 2
  log_interval: 1
