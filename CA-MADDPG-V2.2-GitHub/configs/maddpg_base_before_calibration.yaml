experiment:
  name: maddpg_base
  seed: 42
  device: cuda
  gpu_id: 0

data:
  task_file: data/processed_tasks.csv
  uav_file: data/uav_profiles.csv

environment:
  num_agents: 10
  episode_length: 100
  shared_reward: true

  task_features:
    - task_type_code
    - task_size_MB
    - cpu_cycles_per_bit
    - capability_MIPS
    - task_cpu_demand_cycles
    - delay_deadline_ms
    - energy_deadline_mJ
    - Battery_Level_%
    - Signal_Strength_dBm
    - distance_m
    - channel_gain_dB
    - bandwidth_MHz_x
    - uplink_data_rate_Mbps
    - uplink_power_transfer_mW
    - task_priority_score
    - Priority_Score
    - time_sin
    - time_cos

  agent_features:
    - mec_uav_cpu_GHz
    - mec_uav_remaining_energy_mAh
    - bandwidth_MHz_y
    - uplink_rate_Mbps
    - downlink_rate_Mbps
    - aec_storage_GB
    - aec_ram_GB

  action:
    dimension: 3
    names:
      - selection_score
      - cpu_fraction
      - bandwidth_fraction
    minimum: 0.0
    maximum: 1.0

  reward_weights:
    success: 2.0
    latency: 1.0
    energy: 0.5
    deadline_violation: 2.0
    resource_overload: 1.5
    load_balance: 0.25

training:
  episodes: 1000
  batch_size: 256
  replay_capacity: 200000
  warmup_steps: 2000
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.001
  hidden_dimensions:
    - 256
    - 256
  exploration_noise: 0.20
  minimum_noise: 0.05
  noise_decay: 0.9995
  checkpoint_interval: 100
  evaluation_interval: 50
